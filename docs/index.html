<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}</style>
<title>코코 영어 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f4f7f3;
    --surface: #ffffff;
    --surface-2: #e9f1ec;
    --ink: #1e2a2b;
    --muted: #5f6f6e;
    --line: #d9e3dd;
    --accent: #ff6b4a;
    --accent-ink: #ffffff;
    --accent-soft: #ffe4dc;
    --mint: #2db894;
    --mint-soft: #d8f3ea;
    --sky: #3d7bff;
    --sky-ink: #ffffff;
    --hint-bg: #fff1c2;
    --hint-ink: #6b4d00;
    --danger: #d8434f;
    --danger-soft: #fde4e6;
    --stage: #1f2430;
    --stage-ink: #ffffff;
    --board: #fffdf7;
    --board-ink: #1e2a2b;
    --board-muted: #6b7470;
    --shadow: 0 6px 20px rgba(30, 42, 43, 0.08);
    --radius: 18px;
    --av-fur: #ffb15c; --av-fur-dark: #e08a2f; --av-belly: #fff1d6; --av-ear: #ffd9a8; --av-blush: #ff8a80; --av-line: #3b2a1a; --av-mouth: #7a2e2e; --av-tongue: #ff8aa0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141b1a; --surface: #1e2726; --surface-2: #26312f; --ink: #eef3f0; --muted: #9fb0ab; --line: #34413e;
      --accent: #ff7d5e; --accent-ink: #1a0d09; --accent-soft: #4a2a22; --mint: #3fd0a8; --mint-soft: #1f3f36;
      --sky: #6b9bff; --sky-ink: #0b1630; --hint-bg: #4a3d12; --hint-ink: #ffe8a3; --danger: #ff6b76; --danger-soft: #4a2226;
      --stage: #0f1419; --stage-ink: #ffffff; --board: #fbf7ec; --board-ink: #1e2a2b; --board-muted: #6b7470;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141b1a; --surface: #1e2726; --surface-2: #26312f; --ink: #eef3f0; --muted: #9fb0ab; --line: #34413e;
    --accent: #ff7d5e; --accent-ink: #1a0d09; --accent-soft: #4a2a22; --mint: #3fd0a8; --mint-soft: #1f3f36;
    --sky: #6b9bff; --sky-ink: #0b1630; --hint-bg: #4a3d12; --hint-ink: #ffe8a3; --danger: #ff6b76; --danger-soft: #4a2226;
    --stage: #0f1419; --stage-ink: #ffffff; --board: #fbf7ec; --board-ink: #1e2a2b; --board-muted: #6b7470;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  * { box-sizing: border-box; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 24px; min-height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .logo { font-family: "Baloo 2", "Noto Sans KR", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .logo em { font-style: normal; color: var(--accent); }
  .logo small { font-family: "Noto Sans KR", sans-serif; font-weight: 500; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
  .pill.timer { font-variant-numeric: tabular-nums; background: var(--sky); color: var(--sky-ink); }
  .pill.timer.low { background: var(--danger); color: #fff; }
  .right { display: flex; gap: 6px; align-items: center; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .card + .card { margin-top: 12px; }
  h1 { font-family: "Baloo 2", "Noto Sans KR", sans-serif; font-size: 26px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }

  .field { margin-top: 14px; }
  .field > label, .field > .lbl { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
  .field input[type="text"], .field input[type="number"] { width: 100%; padding: 11px 13px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .choice { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; text-align: left; display: grid; gap: 1px; }
  .choice b { font-size: 14px; }
  .choice small { color: var(--muted); font-size: 12px; }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; font-size: 16px; background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.quiet { background: var(--surface-2); color: var(--ink); }
  .btn.small { width: auto; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: transparent; color: var(--muted); width: auto; padding: 6px 10px; font-size: 13px; }

  .note { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
  .note.warn { background: var(--hint-bg); color: var(--hint-ink); }
  .note.err { background: var(--danger-soft); color: var(--danger); }
  .note.info { background: var(--surface-2); color: var(--muted); }
  .prompt-box { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; background: var(--surface-2); border-radius: 12px; padding: 12px; max-height: 260px; overflow: auto; }
  details summary { cursor: pointer; font-weight: 700; font-size: 14px; }

  /* ===== 줌형 수업 화면 ===== */
  .zoom { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .zoom-main { display: grid; grid-template-columns: minmax(0, 1fr) 176px; gap: 12px; align-items: start; }
  @media (max-width: 640px) { .zoom-main { grid-template-columns: 1fr; } .tiles { flex-direction: row; } .tile { flex: 1; } }
  .share { background: var(--stage); color: var(--stage-ink); border-radius: 18px; padding: 10px; box-shadow: var(--shadow); }
  .share-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #9fe3c7; padding: 2px 6px 8px; }
  .share-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px rgba(45,184,148,.25); }
  .board { background: var(--board); color: var(--board-ink); border-radius: 12px; aspect-ratio: 16 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 8px; overflow: hidden; }
  .board-kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--board-muted); font-weight: 700; }
  .board-title { font-family: "Baloo 2", sans-serif; font-size: clamp(22px, 5vw, 36px); font-weight: 800; line-height: 1.2; }
  .board-sub { color: var(--board-muted); font-size: 15px; }
  .board-emoji { font-size: clamp(56px, 16vw, 96px); line-height: 1; }
  .board-word-en { font-family: "Baloo 2", sans-serif; font-size: clamp(28px, 7vw, 46px); font-weight: 800; }
  .board-word-ko { font-size: 18px; color: var(--board-muted); }
  .board-frame-text { font-size: clamp(20px, 5vw, 30px); font-weight: 700; line-height: 1.5; }
  .board-frame-text .blank { display: inline-block; border-bottom: 3px solid var(--accent); color: var(--accent); margin: 0 4px; }
  .board-scene { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: clamp(40px, 11vw, 72px); line-height: 1.1; }
  .board-question { font-size: clamp(18px, 4.5vw, 26px); font-weight: 800; }
  .board-options { display: grid; gap: 8px; width: 100%; max-width: 360px; }
  .board-option { border: 2px solid #d9e3dd; background: #fff; color: #1e2a2b; border-radius: 12px; padding: 10px 12px; font-size: 16px; text-align: left; }
  .board-option b { display: inline-block; width: 22px; color: var(--accent); }
  .board-option.correct { border-color: var(--mint); background: #d8f3ea; }
  .board-sticker { background: radial-gradient(circle at 50% 40%, #fff3c4, var(--board) 70%); }
  .sticker-emoji { font-size: clamp(64px, 20vw, 110px); line-height: 1; animation: pop .5s ease-out; }
  .sticker-label { font-family: "Baloo 2", sans-serif; font-size: clamp(22px, 5vw, 32px); font-weight: 800; color: #b8461d; }
  @keyframes pop { 0% { transform: scale(.4) rotate(-10deg); opacity: 0; } 70% { transform: scale(1.1) rotate(3deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .caption { margin-top: 10px; padding: 10px 12px; background: rgba(255,255,255,.08); border-radius: 12px; font-size: 17px; line-height: 1.45; min-height: 46px; }
  .caption .hint { margin-top: 8px; background: var(--hint-bg); color: var(--hint-ink); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .dots::after { content: "…"; animation: blink 1s steps(3, end) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .tiles { display: flex; flex-direction: column; gap: 10px; }
  .tile { background: var(--stage); border-radius: 14px; padding: 8px; position: relative; aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: var(--shadow); border: 3px solid transparent; }
  .tile.active { border-color: var(--mint); }
  .tile-name { position: absolute; left: 8px; bottom: 6px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 8px; }
  .avatar-svg { width: 92%; height: 92%; }
  .state-speaking .av-body { animation: bob .5s ease-in-out infinite; transform-origin: 100px 130px; }
  .state-listening .av-body { animation: tilt 2.4s ease-in-out infinite; transform-origin: 100px 130px; }
  .av-eyes { animation: blinkEyes 4.2s infinite; transform-origin: 100px 98px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
  @keyframes blinkEyes { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .student-face { width: 56px; height: 56px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 24px; }
  .student-said { margin-top: 8px; color: #fff; font-size: 14px; text-align: center; padding: 0 6px; max-height: 3.2em; overflow: hidden; }

  .dock { position: sticky; bottom: 0; padding-top: 10px; padding-bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(to top, var(--bg) 75%, transparent); }
  .status { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 20px; margin-bottom: 8px; }
  .status.listening { color: var(--mint); }
  .composer { display: flex; gap: 8px; align-items: stretch; }
  .composer input { flex: 1; min-width: 0; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 16px; }
  .composer .send { border: 0; border-radius: 14px; padding: 0 16px; background: var(--sky); color: var(--sky-ink); font-weight: 800; }
  .composer .mic { border: 0; border-radius: 14px; width: 52px; background: var(--surface); box-shadow: var(--shadow); font-size: 22px; }
  .composer .mic.on { background: var(--mint); color: #fff; animation: pulse 1.2s infinite; }
  .composer button:disabled { opacity: .45; cursor: not-allowed; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(45,184,148,.4); } 50% { box-shadow: 0 0 0 10px rgba(45,184,148,0); } }
  .dock .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .log { margin-top: 8px; background: var(--surface); border-radius: 12px; padding: 10px 12px; max-height: 220px; overflow: auto; font-size: 14px; }
  .log div { margin-bottom: 6px; }
  .log b.t { color: var(--accent); } .log b.s { color: var(--sky); } .log .h { color: var(--hint-ink); }

  /* mock 꾸그 상세페이지 */
  .gg-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .gg-logo { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 22px; color: #ff5a36; letter-spacing: -0.02em; }
  .gg-nav { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
  .gg-hero { background: linear-gradient(135deg, #ffe4dc, #fff1c2); border-radius: 18px; aspect-ratio: 16 / 8; display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; overflow: hidden; }
  .gg-hero .avatar-svg { width: 150px; height: 150px; }
  .gg-hero .bubble { background: #fff; color: #1e2a2b; border-radius: 16px; padding: 10px 14px; font-weight: 700; box-shadow: var(--shadow); }
  .gg-tag { display: inline-block; background: var(--mint-soft); color: var(--mint); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-bottom: 6px; }
  .gg-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .gg-price { font-size: 20px; font-weight: 800; color: #ff5a36; margin: 6px 0 12px; }
  .gg-price small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .gg-points { display: grid; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .gg-points li { display: flex; gap: 8px; font-size: 14px; }
  .gg-child { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .gg-child label { font-size: 13px; color: var(--muted); }
  .gg-child input { padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); width: 110px; }
  .gg-child input[type="number"] { width: 70px; }
  .gg-cta { background: #ff5a36; color: #fff; border: 0; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 17px; width: 100%; }
  .gg-foot { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .welcome-avatar { width: 200px; height: 160px; margin: 0 auto 6px; background: var(--stage); border-radius: 20px; display: flex; align-items: center; justify-content: center; }
  .welcome-avatar .avatar-svg { width: 90%; height: 90%; }
  .progress { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; }
  .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .progress-dot.on { background: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .center { text-align: center; }

  /* report */
  .praise { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; font-family: "Baloo 2", "Noto Sans KR", sans-serif; font-weight: 800; font-size: 20px; text-align: center; text-wrap: balance; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-family: "Baloo 2", sans-serif; }
  .stat span { font-size: 12px; color: var(--muted); }
  ul { padding-left: 20px; margin: 0 0 8px; }
  li { margin-bottom: 5px; }
  .fix { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font-size: 15px; }
  .fix s { color: var(--muted); }
  .fix b { color: var(--mint); }
  .fix .why { display: block; color: var(--muted); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { .composer .mic.on, .dots::after, .av-body, .av-eyes, .sticker-emoji { animation: none !important; } }
</style>

</head>
<body>
<div class="app" id="app">
  <div class="top" id="top">
    <div class="logo" id="logo">코코 <em>영어 선생님</em></div>
    <div class="right" id="topRight"><span class="pill">데모 · 시간당 1,000원</span></div>
  </div>
  <div id="view"></div>
</div>

<script>
(() => {
  "use strict";

  // ---------- 선생님 지침 ----------
  // 앱의 src/lib/tutor/prompt.ts 와 같은 내용. `node scripts/sync-demo-prompt.mjs` 로 동기화한다.
  /* PROMPT:BEGIN */
  const CORE = `You are Coco, a warm, playful 1:1 English speaking tutor for Korean children on Gguge (꾸그), an online class platform for kids.

Your job is to LEAD a spoken conversation lesson. The student hears your words through text-to-speech and answers by speaking. Everything you write is spoken aloud, so write the way a friendly teacher talks.

# How to lead
- You drive the lesson. Every turn ends with exactly one question or one simple instruction that invites the student to speak.
- Keep each turn short: one to three short sentences. Never lecture or explain at length.
- Shape the lesson as warm-up, topic talk, a mini role-play or quick game, then wrap-up. Pace it using the phase and time notes you receive, and use the lesson plan's words, frames, role-play and game.
- Follow the lesson topic, but follow the student's interest when they show one.
- Ask questions the student can actually answer at their level. If they stall, offer two choices ("Do you like dogs or cats?") or a sentence frame ("You can say: I like ...").
- Praise effort specifically ("Nice, you used 'because'!"), not generically. Do not praise every single turn.
- Vary your openers. Do not start every turn with "Great" or "Wow".

# Corrections (recasting)
- Do not stop the flow to teach grammar. When the student makes a mistake, naturally repeat their idea in correct English inside your reply (a recast), then move on. Example: the student says "I go park yesterday" and you reply "Oh, you went to the park yesterday! Who did you go with?"
- At most one explicit mini-correction every three or four turns, and only when it matters: "Small tip: for yesterday we say 'went'. Try it: I went to the park."
- If the transcript looks garbled or unclear, kindly ask them to say it once more. Never say "wrong".

# Language
- Speak English only in "say". Do not put Korean in it.
- "hint": if the student seems lost (says "I don't know", answers in Korean, or stays silent), give a short Korean hint, either the meaning of your question or the exact English sentence they could say. The hint is shown as text and is not spoken. Otherwise null. Use it often for starters, sometimes for basic, rarely for intermediate.
- If the student speaks Korean, understand it, answer in English, and give them the English words they needed.

# Board (the shared screen) and mood
You teach next to a shared board the student can see, like a teacher sharing a screen. Each turn you may put ONE thing on the board, or leave it as it is (board: null). Use the board about every second or third turn, when it helps the student speak:
- word_card: a key word with an emoji and its Korean meaning, when you introduce or recast a word.
- sentence_frame: a fill-in frame like "I like ___ because ___." with an example, when the student needs a structure to answer.
- picture: an emoji scene (2 to 6 emojis) with a short caption, then ask the student to describe or talk about it.
- quiz: one question with three short options, for a quick game. Say the options out loud too. Reveal the answer in your next turn.
- sticker: a reward emoji with a short label, after real effort or at wrap-up. At most one sticker every four turns.
Refer to the board naturally ("Look at the board", "Can you read this?"). Keep board text short and at the student's level.
"mood" is your face: happy when the student did well, curious when asking about them, encouraging when they struggle or stay silent, neutral otherwise.

# Safety and care
- Kid-safe content only. No romance, violence, scary or gross topics, no requests for personal data (address, school name, phone number), no links.
- If the student shares something worrying (being hurt, bullied, very sad), respond kindly in simple English, suggest talking to a parent or teacher, and gently return to the lesson.
- If sincerely asked, say you are an AI English teacher. Do not pretend to be human.

# Format
- "say" is plain spoken text: no markdown, no emojis, no bullet lists, no stage directions, no labels like "Coco:".
- Do not narrate about being an AI unless asked.

# Notes you will see in square brackets (from the lesson system, not the student)
- [Lesson starts] : greet the student by name in one short sentence, then ask your first easy question.
- [The student did not answer for N seconds] : re-ask more simply with two choices. Do not scold.
- [Lesson phase: ...] : move into that part of the lesson within a turn or two (warm-up, topic talk, role-play or game, wrap-up). Introduce a role-play or game briefly and clearly, then play it.
- [Time left: N minutes] : begin wrapping up. Do not mention the clock to the student.
- [Time is up] : say goodbye warmly in one or two sentences, naming one thing they did well, put a sticker on the board, and end with no question.`;
  /* PROMPT:END */

  /* LESSONS:BEGIN */

    return `<svg viewBox="0 0 200 200" class="avatar-svg state-${state}" role="img" aria-label="코코 선생님">
      <ellipse cx="46" cy="70" rx="18" ry="24" fill="var(--av-fur-dark)" transform="rotate(-18 46 70)"/><ellipse cx="154" cy="70" rx="18" ry="24" fill="var(--av-fur-dark)" transform="rotate(18 154 70)"/>
      <ellipse cx="48" cy="72" rx="10" ry="15" fill="var(--av-ear)" transform="rotate(-18 48 72)"/><ellipse cx="152" cy="72" rx="10" ry="15" fill="var(--av-ear)" transform="rotate(18 152 72)"/>
      <g class="av-body">
        <ellipse cx="100" cy="112" rx="72" ry="66" fill="var(--av-fur)"/><ellipse cx="100" cy="132" rx="46" ry="34" fill="var(--av-belly)"/>
        <circle cx="60" cy="118" r="9" fill="var(--av-blush)" opacity=".8"/><circle cx="140" cy="118" r="9" fill="var(--av-blush)" opacity=".8"/>
        <path d="M62 ${78 + browLift} q14 ${-8 + browTilt} 28 0" stroke="var(--av-line)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M110 ${78 + browLift} q14 ${-8 - browTilt} 28 0" stroke="var(--av-line)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g class="av-eyes" transform="translate(${lookX} ${lookY})">
          <g transform="translate(76 98) scale(${eyeScale})"><ellipse rx="9" ry="11" fill="var(--av-line)"/><circle cx="3" cy="-4" r="3" fill="#fff"/></g>
          <g transform="translate(124 98) scale(${eyeScale})"><ellipse rx="9" ry="11" fill="var(--av-line)"/><circle cx="3" cy="-4" r="3" fill="#fff"/></g>
        </g>
        <ellipse cx="100" cy="116" rx="7" ry="5" fill="var(--av-line)"/>
        ${mouth}
      </g>${think}</svg>`;
  }
  function drawAvatar() { for (const a of document.querySelectorAll("[data-avatar]")) a.innerHTML = avatarSvg(); }
  function startMouth() { stopMouth(); mouthTimer = setInterval(() => { S.mouth = S.mouth > 0.3 ? 0.05 : 0.35 + Math.random() * 0.65; drawAvatar(); }, 110); }
  function stopMouth() { if (mouthTimer) clearInterval(mouthTimer); mouthTimer = null; S.mouth = 0; drawAvatar(); }

  // ---------- 음성 ----------
  let voice;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return null;
    const en = vs.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
    const pref = ["Google US English", "Samantha", "Microsoft Aria", "Microsoft Jenny", "Karen"];
    return en.find((v) => pref.some((p) => v.name.includes(p))) || en.find((v) => v.lang.toLowerCase() === "en-us") || en[0] || null;
  }
  if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }
  function speak(text) {
    if (!("speechSynthesis" in window) || !text.trim() || !S.tts) return Promise.resolve();
    speechSynthesis.cancel();
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = S.profile.level === "starter" ? 0.88 : 0.95; u.pitch = 1.05;
      voice = voice || pickVoice(); if (voice) u.voice = voice;
      let done = false;
      const finish = () => { if (done) return; done = true; stopMouth(); resolve(); };
      u.onstart = startMouth;
      u.onboundary = () => { S.mouth = 1; drawAvatar(); };
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
      setTimeout(() => { if (!speechSynthesis.speaking && !speechSynthesis.pending) finish(); }, 800);
    });
  }
  const stopSpeak = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); stopMouth(); };

  function listen() {
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) { S.micState = "off"; return false; }
    let rec;
    try { rec = new Ctor(); } catch { S.micState = "off"; return false; }
    rec.lang = "en-US"; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    let finalText = "", aborted = false, failed = false;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
      S.interim = finalText + interim; renderStudent();
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      failed = true; S.micState = "off";
      S.notice = e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "이 데모 페이지에서는 마이크를 쓸 수 없어요. 글로 대답해 주세요. 실제 앱에서는 아이가 말로 대답해요."
        : `음성 인식 오류: ${e.error}`;
      S.phase = "idle"; render();
    };
    rec.onend = () => {
      S.rec = null;
      if (aborted || failed) return;
      const t = finalText.trim(); S.interim = "";
      if (t) { S.silence = 0; sendTurn({ kind: "speech", text: t }); }
      else if (S.phase === "listening") {
        if (S.silence < MAX_SILENCE) { S.silence += 1; sendTurn({ kind: "silence" }); }
        else { S.phase = "idle"; render(); }
      }
    };
    try { rec.start(); } catch { S.micState = "off"; return false; }
    S.rec = { stop: () => rec.stop(), abort: () => { aborted = true; rec.abort(); } };
    S.micState = "ok";
    return true;
  }
  const stopListen = () => { if (S.rec) S.rec.abort(); S.rec = null; S.interim = ""; };

  // ---------- Claude 호출 (두 가지 백엔드) ----------
  function sessionBlock() {
    const p = S.profile, topic = TOPICS.find((t) => t.id === p.topicId), lv = LEVELS.find((l) => l.id === p.level);
    return `Student: ${p.name}, age ${p.age}.\nLesson length: ${p.durationMin} minutes.\nToday's topic: ${topic.en}.\n${lv.guide}\n\n${lessonPlanText(p.topicId)}`;
  }
  const isHaiku = (m) => m.startsWith("claude-haiku");
  const hasFallbacks = (m) => /^claude-(opus-5|fable)/.test(m);

  async function directMessages({ system, messages, schema, maxTokens, effort, signal }) {
    const model = direct.model;
    const headers = { "content-type": "application/json", "x-api-key": direct.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
    const body = { model, max_tokens: maxTokens, system, messages, output_config: { format: { type: "json_schema", schema } } };
    if (!isHaiku(model)) body.output_config.effort = effort;
    if (hasFallbacks(model)) { body.fallbacks = "default"; headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; }
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body), signal });
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled" };
      throw { code: "upstream_error", message: String(e) };
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err && err.error && err.error.message ? err.error.message : `HTTP ${res.status}`;
      if (res.status === 401) throw { code: "bad_key", message: msg };
      if (res.status === 429) throw { code: "rate_limited", message: msg };
      if (res.status === 400) throw { code: "invalid_request", message: msg };
      throw { code: "upstream_error", message: msg };
    }
    const data = await res.json();
    if (data.stop_reason === "refusal") throw { code: "refused" };
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    if (!text.trim()) throw { code: "empty_completion" };
    try { return JSON.parse(text); } catch { throw { code: "invalid_json", text }; }
  }

  /** 선생님 한 턴. 대화 turns 는 {role, content(string)} */
  async function askTutor(turns, signal) {
    if (HAS_CLAUDE) {
      const sample = S.sample || (await sampleReady);
      if (!sample) throw { code: "not_granted" };
      return sample.json([{ role: "user", content: instructions() }, ...turns], { cache: false, modelTier: "quick", signal });
    }
    return directMessages({
      system: [
        { type: "text", text: CORE, cache_control: { type: "ephemeral" } },
        { type: "text", text: sessionBlock(), cache_control: { type: "ephemeral" } },
      ],
      messages: turns, schema: SCHEMAS.turn, maxTokens: 1500, effort: "low", signal,
    });
  }
  async function askReport(prompt) {
    if (HAS_CLAUDE) return S.sample.json(prompt, { modelTier: "default", cache: false });
    return directMessages({ system: "You write short, honest lesson reports for parents.", messages: [{ role: "user", content: prompt }], schema: SCHEMAS.report, maxTokens: 4000, effort: "medium" });
  }

  // ---------- 턴 ----------
  async function sendTurn(input) {
    if (S.busy || ["report", "ending", "gguge", "welcome"].includes(S.phase) && input.kind !== "start") return;
    if (HAS_CLAUDE && !(S.sample || (await sampleReady))) { S.error = "이 페이지에서는 Claude 를 쓸 수 없어요. claude.ai 안에서 열어 주세요."; S.phase = "idle"; render(); return; }
    if (!HAS_CLAUDE && !direct.key) { S.error = "API 키가 없어요. 상세페이지의 테스트 설정에서 키를 넣어 주세요."; S.phase = "idle"; render(); return; }
    S.busy = true; stopListen(); stopSpeak(); S.error = null;
    if (S.startedAt === null) S.startedAt = Date.now();
    const g = gate();
    if (g === "closed") { S.busy = false; return finishLesson(); }
    const left = remainingSec();
    const note = g === "grace" || input.kind === "timeup" ? "[Time is up]" : timeNote(left);
    const phase = lessonPhase(1 - left / (S.profile.durationMin * 60));
    let phaseNote = null;
    if (input.kind === "start") S.lastPhase = "warm-up";
    else if (phase !== S.lastPhase) { phaseNote = `[Lesson phase: ${phase}]`; S.lastPhase = phase; }
    const parts = [];
    if (input.kind === "start") parts.push("[Lesson starts]");
    else if (input.kind === "silence") parts.push(`[The student did not answer for ${SILENCE_SEC} seconds]`);
    else if (input.kind === "speech") parts.push(input.text.trim());
    if (phaseNote && !note) parts.push(phaseNote);
    if (note) parts.push(note);
    const content = parts.join("\n");
    S.turns.push({ role: "user", content });
    if (input.kind === "speech") S.shown.push({ role: "student", text: input.text.trim() });
    S.phase = "thinking"; render();

    const recent = S.turns.slice(-60); // 64KiB 제한: 지침은 유지, 오래된 턴부터 버림
    const ctl = new AbortController(); S.ctl = ctl;
    let out;
    try {
      const raw = await askTutor(recent, ctl.signal);
      out = coerceOutput(raw);
      if (!out.say) throw { code: "empty_completion" };
    } catch (e) {
      S.turns.pop(); if (input.kind === "speech") S.shown.pop();
      if (!(e && e.code === "cancelled")) { S.error = copyFor(e); if (permanent(e)) S.sampleGone = true; }
      if (S.turns.length === 0) { S.startedAt = null; S.visitor.minutes += S.profile.durationMin; S.phase = "welcome"; }
      else S.phase = "idle";
      S.busy = false; render(); return;
    }
    S.turns.push({ role: "assistant", content: JSON.stringify(out) });
    S.shown.push({ role: "tutor", text: out.say, hint: out.hint });
    S.mood = out.mood;
    if (out.board) { S.prevBoard = S.board; S.board = out.board; } else { S.prevBoard = S.board; }
    S.phase = "speaking"; render();
    await speak(out.say);
    S.busy = false;
    const ended = g === "grace" || input.kind === "timeup";
    if (ended) { S.endedAt = Date.now(); return finishLesson(); }
    startListening();
  }

  function startListening() {
    if (S.busy || ["report", "ending"].includes(S.phase)) return;
    if (S.micState === "off") { S.phase = "idle"; render(); focusInput(); return; }
    S.phase = "listening"; render();
    if (!listen()) { S.phase = "idle"; render(); focusInput(); }
  }
  const focusInput = () => { const i = $("#say"); if (i) i.focus(); };
  function submitText(text) {
    const t = (text || "").trim(); if (!t) return;
    S.silence = 0;
    if (S.phase === "speaking") { stopSpeak(); S.busy = false; }
    sendTurn({ kind: "speech", text: t });
  }

  async function finishLesson() {
    stopListen(); stopSpeak();
    if (S.ctl) S.ctl.abort();
    S.endedAt = S.endedAt || Date.now();
    S.phase = "ending"; S.error = null; render();
    const studentTurns = S.shown.filter((t) => t.role === "student").length;
    if (studentTurns === 0 || !canCall()) { S.report = null; S.phase = "report"; render(); return; }
    const transcript = S.shown.map((t) => `${t.role === "tutor" ? "Tutor" : "Student"}: ${t.text}`).join("\n");
    const p = S.profile, topic = TOPICS.find((t) => t.id === p.topicId);
    const prompt = `You write short, honest lesson reports for parents of Korean children after a 1:1 English speaking lesson with an AI tutor.
Write Korean fields in warm, plain Korean (존댓말). Be specific: quote what the student actually said. Do not exaggerate. If the student spoke very little, say so kindly and suggest what would help.

Student: ${p.name}, age ${p.age}, level ${p.level}. Topic: ${topic.en}. Lesson length: ${p.durationMin} minutes.

<transcript>
${transcript}
</transcript>

Reply with ONLY one JSON object of this exact shape:
{"summary_ko": string (3-4 sentences for parents), "strengths_ko": string[] (max 3), "corrections": [{"student_said": string, "better": string, "note_ko": string}] (max 5, skip transcription noise), "new_expressions": [{"expression": string, "meaning_ko": string}] (max 6), "next_lesson_focus_ko": string, "level_signal": "below" | "on" | "above", "praise_for_student_en": string (one sentence to read to the child)}`;
    try {
      const r = await askReport(prompt);
      S.report = r && typeof r === "object" ? r : null;
    } catch (e) { S.report = null; S.error = copyFor(e); }
    S.phase = "report"; render();
  }

  // 타이머
  setInterval(() => {
    if (!S.profile || S.startedAt === null) return;
    if (["gguge", "welcome", "ending", "report"].includes(S.phase)) return;
    const left = remainingSec();
    const t = $("#timer"); if (t) { t.textContent = fmt(left); t.classList.toggle("low", left <= 60); }
    if (left <= 0 && !S.timeUpSent) {
      S.timeUpSent = true;
      const fire = () => { if (S.busy) return setTimeout(fire, 500); sendTurn({ kind: "timeup" }); };
      fire();
    }

  // ---------- 화면 ----------
  function render() {
    const view = $("#view"), right = $("#topRight"), logo = $("#logo"), top = $("#top");
    view.replaceChildren();
    top.hidden = S.phase === "gguge";
    logo.replaceChildren("코코 ", el("em", {}, "영어 선생님"), S.profile && !["gguge", "welcome", "report"].includes(S.phase) ? el("small", {}, " · " + TOPICS.find((t) => t.id === S.profile.topicId).label) : null);
    if (S.phase === "gguge") return view.append(renderGguge());
    if (S.phase === "welcome") { right.replaceChildren(el("span", { class: "pill", style: "background:var(--mint-soft);color:var(--mint)" }, `남은 수업 시간 ${S.visitor.minutes}분`)); return view.append(renderWelcome()); }
    if (S.phase === "report") { right.replaceChildren(el("span", { class: "pill" }, "수업 끝")); return view.append(renderReport()); }
    right.replaceChildren(
      el("span", { class: "pill timer" + (remainingSec() <= 60 && S.startedAt ? " low" : ""), id: "timer" }, fmt(remainingSec())),
      el("button", { class: "btn quiet small", onclick: () => finishLesson(), disabled: S.phase === "ending" }, "끝내기"),
    );
    view.append(renderLesson());
  }

  // ---------- 꾸그 상세페이지 (목업) ----------

    const ageIn = el("input", { type: "number", id: "ggAge", min: "5", max: "15", value: String(saved.age) });
    S.mood = "happy";
    const root = el("div", {},
      el("div", { class: "gg-top" }, el("div", { class: "gg-logo" }, "꾸그"), el("div", { class: "gg-nav" }, el("span", {}, "라이브 클래스"), el("span", {}, "AI 선생님"), el("span", {}, "마이페이지"))),
      el("div", { class: "card" },
        el("div", { class: "gg-hero" }, el("div", { "data-avatar": "" }), el("div", { class: "bubble" }, "Hello! I'm Coco 👋")),

        el("div", { class: "gg-price" }, "시간당 1,000원", el("small", {}, "20분 333원 · 10분 167원")),
        el("ul", { class: "gg-points" },
          el("li", {}, "🗣️ ", "선생님이 질문을 이어가서 아이가 계속 말하게 해요"),

          save("coco.child", { name, age });
          // 실제 꾸그에서는 여기서 서버가 서명 토큰을 만들어 /start 로 보낸다. 데모에서는 바로 웰컴으로.
          S.visitor = { name, age, minutes: 60 };

        HAS_CLAUDE && S.sampleGone ? el("div", { class: "note err" }, "이 페이지에서는 Claude 를 쓸 수 없어요. claude.ai 안에서 열어 주세요.") : null,
        el("details", { style: "margin-top:14px" }, el("summary", {}, "선생님 지침 보기"), el("div", { class: "prompt-box", style: "margin-top:8px" }, CORE)),
      ),
    );
    queueMicrotask(drawAvatar);
    return root;
  }

  // ---------- 브라우저 직접 호출 모드의 테스트 설정 (API 키·모델) ----------
  function renderDirectSettings() {

  // ---------- 웰컴 (인사·소리 확인 → 레벨 → 주제 → 길이) ----------
  async function sayHello() {
    if (!("speechSynthesis" in window)) { S.welcome.heard = true; render(); return; }
    S.welcome.speaking = true; S.mood = "happy"; render();
    speechSynthesis.cancel();
    await new Promise((resolve) => {

  }

  function renderWelcome() {

    );
    const input = el("input", { type: "text", id: "say", placeholder: "영어로 대답하기 (한국어도 알아들어요)", autocomplete: "off", disabled: busy });
    const send = el("button", { type: "submit", class: "send", disabled: busy }, "보내기");
    const mic = S.micState === "off" ? null : el("button", { type: "button", class: "mic" + (S.phase === "listening" ? " on" : ""), "aria-label": "마이크", disabled: busy, onclick: () => {

      el("div", { class: "status" + (S.phase === "listening" ? " listening" : "") }, statusText),

        el("span", {}, `${S.profile.durationMin}분 · ${priceKrw(S.profile.durationMin).toLocaleString("ko-KR")}원 · ${LEVELS.find((l) => l.id === S.profile.level).label}`)),
      S.showLog ? el("div", { class: "log" }, S.shown.map((t) => el("div", {}, el("b", { class: t.role === "tutor" ? "t" : "s" }, t.role === "tutor" ? "Coco" : S.profile.name), " " + t.text, t.hint ? el("span", { class: "h" }, " · 힌트: " + t.hint) : null))) : null,
    );
    const root = el("div", { class: "zoom" }, el("div", { class: "zoom-main" }, share, tiles), dock);
    queueMicrotask(() => { drawAvatar(); renderStudent(); if (S.phase === "idle") focusInput(); });

  }

  function renderReport() {
    const r = S.report, p = S.profile;

        arr(r.new_expressions).length ? [el("h2", {}, "오늘 배운 표현"), el("ul", {}, arr(r.new_expressions).map((x) => el("li", {}, el("b", {}, String(x.expression || "")), " — ", String(x.meaning_ko || ""))))] : null,
