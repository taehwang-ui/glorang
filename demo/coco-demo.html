  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141b1a;
    --surface: #1e2726;
    --surface-2: #26312f;
    --ink: #eef3f0;
    --muted: #9fb0ab;
    --line: #34413e;
    --accent: #ff7d5e;
    --accent-ink: #1a0d09;
    --accent-soft: #4a2a22;
    --mint: #3fd0a8;
    --mint-soft: #1f3f36;
    --sky: #6b9bff;
    --sky-ink: #0b1630;

  .app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 24px; min-height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .logo { font-family: "Baloo 2", "Noto Sans KR", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .logo em { font-style: normal; color: var(--accent); }

  .field { margin-top: 14px; }
  .field > label, .field > .lbl { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
  .field input[type="text"], .field input[type="number"] { width: 100%; padding: 11px 13px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }

  .btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; font-size: 16px; background: var(--accent); color: var(--accent-ink); width: 100%; }

  .note { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }

  /* lesson */
  .stage { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .bubble { max-width: 88%; padding: 12px 15px; border-radius: 20px; font-size: 17px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.tutor { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
  .bubble.tutor .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 12px; }
  .bubble.student { align-self: flex-end; background: var(--sky); color: var(--sky-ink); border-bottom-right-radius: 6px; }
  .bubble.student.interim { opacity: .6; }
  .bubble.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 8px; }
  .hint { margin-top: 8px; background: var(--hint-bg); color: var(--hint-ink); border-radius: 10px; padding: 8px 10px; font-size: 14px; }

  .dock { position: sticky; bottom: 0; padding-top: 10px; padding-bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(to top, var(--bg) 75%, transparent); }

  .composer { display: flex; gap: 8px; align-items: stretch; }

  .composer .send { border: 0; border-radius: 14px; padding: 0 16px; background: var(--sky); color: var(--sky-ink); font-weight: 800; }

  .dock .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* report */
  .praise { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; font-family: "Baloo 2", "Noto Sans KR", sans-serif; font-weight: 800; font-size: 20px; text-align: center; text-wrap: balance; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-family: "Baloo 2", sans-serif; }
  .stat span { font-size: 12px; color: var(--muted); }
  ul { padding-left: 20px; margin: 0 0 8px; }
  li { margin-bottom: 5px; }
  .fix { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font-size: 15px; }
  .fix s { color: var(--muted); }
  .fix b { color: var(--mint); }
  .fix .why { display: block; color: var(--muted); font-size: 13px; }
  .prompt-box { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; background: var(--surface-2); border-radius: 12px; padding: 12px; max-height: 260px; overflow: auto; }
  details summary { cursor: pointer; font-weight: 700; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { .composer .mic.on, .dots::after { animation: none; } }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="logo">코코 <em>영어 선생님</em></div>
    <div id="topRight"><span class="pill">데모 · 시간당 1,000원</span></div>
  </div>
  <div id="view"></div>
</div>

<script>
(() => {
  "use strict";

  // ---------- 선생님 지침 (앱의 src/lib/tutor/prompt.ts 와 같은 내용) ----------
  const CORE = `You are Coco, a warm, playful 1:1 English speaking tutor for Korean children on Gguge (꾸그), an online class platform for kids.

Your job is to LEAD a spoken conversation lesson. The student hears your words through text-to-speech and answers by speaking. Everything you write is spoken aloud, so write the way a friendly teacher talks.

# How to lead
- You drive the lesson. Every turn ends with exactly one question or one simple instruction that invites the student to speak.
- Keep each turn short: one to three short sentences. Never lecture or explain at length.
- Shape the lesson as warm-up, topic talk, a mini role-play or quick game, then wrap-up. Pace it using the time notes you receive.
- Follow the lesson topic, but follow the student's interest when they show one.
- Ask questions the student can actually answer at their level. If they stall, offer two choices ("Do you like dogs or cats?") or a sentence frame ("You can say: I like ...").
- Praise effort specifically ("Nice, you used 'because'!"), not generically. Do not praise every single turn.
- Vary your openers. Do not start every turn with "Great" or "Wow".

# Corrections (recasting)
- Do not stop the flow to teach grammar. When the student makes a mistake, naturally repeat their idea in correct English inside your reply (a recast), then move on. Example: the student says "I go park yesterday" and you reply "Oh, you went to the park yesterday! Who did you go with?"
- At most one explicit mini-correction every three or four turns, and only when it matters: "Small tip: for yesterday we say 'went'. Try it: I went to the park."
- If the transcript looks garbled or unclear, kindly ask them to say it once more. Never say "wrong".

# Language
- Speak English only in your spoken text. Do not write Korean in it.
- Exception, a hint line: if the student seems lost (says "I don't know", answers in Korean, or stays silent), you may add ONE final line that starts with "HINT: " followed by a short Korean hint, either the meaning of your question or the exact English sentence they could say. The hint is shown as text and is not spoken. Use it often for starters, sometimes for basic, rarely for intermediate.
- If the student speaks Korean, understand it, answer in English, and give them the English words they needed.

# Safety and care
- Kid-safe content only. No romance, violence, scary or gross topics, no requests for personal data (address, school name, phone number), no links.
- If the student shares something worrying (being hurt, bullied, very sad), respond kindly in simple English, suggest talking to a parent or teacher, and gently return to the lesson.
- If sincerely asked, say you are an AI English teacher. Do not pretend to be human.

# Format
- Plain text only: no markdown, no emojis, no bullet lists, no stage directions, no labels like "Coco:".
- Do not narrate about being an AI unless asked.

# Notes you will see in square brackets (from the lesson system, not the student)
- [Lesson starts] : greet the student by name in one short sentence, then ask your first easy question.
- [The student did not answer for N seconds] : re-ask more simply with two choices. Do not scold.
- [Time left: N minutes] : begin wrapping up. Do not mention the clock to the student.
- [Time is up] : say goodbye warmly in one or two sentences, naming one thing they did well, and end with no question.`;

  const LEVELS = [
    { id: "starter", label: "처음이에요", desc: "단어·짧은 문장 (초등 저학년)", guide: "Level: starter. Use very short sentences with simple present tense and everyday words. Ask yes/no or either/or questions. Repeat key words twice in a natural way. Keep each turn under about 20 words. Offer a HINT line whenever the student hesitates." },
    { id: "basic", label: "기초 문장 가능", desc: "간단한 문장으로 대답 (초등 중학년)", guide: "Level: basic. Simple past and future are fine. Ask open questions but give a sentence frame when the student stalls. Keep each turn under about 35 words. Offer a HINT line only when the student is clearly stuck." },
    { id: "intermediate", label: "대화 가능", desc: "2~3문장으로 이야기 (초등 고학년~)", guide: "Level: intermediate. Ask why and how questions and invite two or three sentence answers. Introduce one or two new useful expressions during the lesson and reuse them. Keep each turn under about 50 words. Use a HINT line rarely." },
  ];
  const TOPICS = [
    { id: "favorites", label: "내가 좋아하는 것", en: "My favorite things" },
    { id: "animals", label: "동물", en: "Animals and pets" },
    { id: "food", label: "음식", en: "Food I like and don't like" },
    { id: "myday", label: "나의 하루", en: "My day: morning, school, evening" },
    { id: "family", label: "가족", en: "My family" },
    { id: "school", label: "학교", en: "School and friends" },
    { id: "weekend", label: "주말", en: "What I did last weekend" },
    { id: "free", label: "자유 대화", en: "Free talk: let the student choose" },
  ];
  const DURATIONS = [3, 10, 20, 30];
  const PRICE_PER_HOUR = 1000;
  const GRACE_SEC = 90;
  const SILENCE_SEC = 10;
  const MAX_SILENCE = 2;
  const priceKrw = (min) => Math.round((PRICE_PER_HOUR * min) / 60);

  // ---------- 상태 ----------
  const S = {
    phase: "setup", // setup | ready | thinking | speaking | listening | idle | ending | report
    profile: null,
    turns: [],       // {role, content} 그대로 Claude 에 보내는 대화
    shown: [],       // 화면용 {role, text, hint}
    live: "",
    interim: "",
    startedAt: null,
    endedAt: null,
    silence: 0,
    timeUpSent: false,
    busy: false,
    ctl: null,
    sample: null,
    sampleGone: false,
    micState: "unknown", // unknown | ok | off
    rec: null,
    report: null,
    error: null,
    notice: null,
  };

  let sampleReady = window.claude && window.claude.use ? window.claude.use("sample").then((s) => { S.sample = s; if (!s) S.sampleGone = true; render(); return s; }) : Promise.resolve(null);
  if (!(window.claude && window.claude.use)) S.sampleGone = true;

  // ---------- 유틸 ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  function splitHint(raw) {
    const speech = [], hints = [];
    for (const line of raw.split(/\r?\n/)) {
      const m = line.match(/^\s*HINT:\s*(.*)$/i);
      if (m) hints.push(m[1].trim()); else speech.push(line);
    }
    return { speech: speech.join("\n").trim(), hint: hints.length ? hints.join(" ") : null };
  }
  function remainingSec() {
    if (S.startedAt === null) return S.profile.durationMin * 60;
    return Math.max(0, Math.ceil((S.startedAt + S.profile.durationMin * 60000 - Date.now()) / 1000));
  }
  function gate() {
    if (S.startedAt === null) return "open";
    const end = S.startedAt + S.profile.durationMin * 60000, now = Date.now();
    if (now < end) return "open";
    if (now < end + GRACE_SEC * 1000) return "grace";
    return "closed";
  }
  function timeNote(left) {
    if (left <= 0) return "[Time is up]";
    const m = Math.ceil(left / 60);
    return m <= 2 ? `[Time left: ${m} minute${m === 1 ? "" : "s"}]` : null;
  }
  function instructions() {
    const p = S.profile, topic = TOPICS.find((t) => t.id === p.topicId), lv = LEVELS.find((l) => l.id === p.level);
    return CORE + `\n\n# This lesson\nStudent: ${p.name}, age ${p.age}.\nLesson length: ${p.durationMin} minutes.\nToday's topic: ${topic.en}.\n${lv.guide}`;
  }
  const ERR_COPY = {
    not_granted: "이 페이지에서 Claude 사용을 허용하지 않아 선생님을 부를 수 없어요.",
    sampling_disabled: "이 계정에서는 Claude 를 쓸 수 없어요.",
    rate_limited: "지금은 요청이 많아요. 잠시 뒤 다시 보내 주세요.",
    session_expired: "로그인이 만료됐어요. 다시 로그인한 뒤 열어 주세요.",
    refused: "선생님이 이 대답에는 응답하지 않았어요. 다른 말로 해 볼까요?",
    empty_completion: "선생님이 아무 말도 하지 않았어요. 다시 보내 주세요.",
    prompt_too_large: "대화가 너무 길어졌어요. 수업을 끝내고 새로 시작해 주세요.",
    invalid_json: "리포트 형식이 맞지 않았어요. 다시 만들어 볼게요.",
    upstream_error: "연결이 잠깐 끊겼어요. 다시 보내 주세요.",
  };
  const copyFor = (e) => ERR_COPY[e && e.code] || ERR_COPY.upstream_error;
  const permanent = (e) => ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code);

  // ---------- 음성 ----------
  let voice;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return null;
    const en = vs.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
    const pref = ["Google US English", "Samantha", "Microsoft Aria", "Microsoft Jenny", "Karen"];
    return en.find((v) => pref.some((p) => v.name.includes(p))) || en.find((v) => v.lang.toLowerCase() === "en-us") || en[0] || null;
  }
  if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }
  function speak(text) {
    if (!("speechSynthesis" in window) || !text.trim() || !S.tts) return Promise.resolve();
    speechSynthesis.cancel();
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = S.profile.level === "starter" ? 0.88 : 0.95; u.pitch = 1.05;
      voice = voice || pickVoice(); if (voice) u.voice = voice;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
      setTimeout(() => { if (speechSynthesis.speaking || speechSynthesis.pending) return; resolve(); }, 600); // 미지원 환경에서 멈춤 방지
    });
  }
  const stopSpeak = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); };

  function listen() {
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) { S.micState = "off"; return false; }
    let rec;
    try { rec = new Ctor(); } catch { S.micState = "off"; return false; }
    rec.lang = "en-US"; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    let finalText = "", aborted = false, failed = false;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      S.interim = finalText + interim; render();
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      failed = true;
      S.micState = "off";
      S.notice = e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "이 데모 페이지에서는 마이크를 쓸 수 없어요. 글로 대답해 주세요. 실제 앱에서는 아이가 말로 대답해요."
        : `음성 인식 오류: ${e.error}`;
      S.phase = "idle"; render();
    };
    rec.onend = () => {
      S.rec = null;
      if (aborted || failed) return;
      const t = finalText.trim(); S.interim = "";
      if (t) { S.silence = 0; sendTurn({ kind: "speech", text: t }); }
      else if (S.phase === "listening") {
        if (S.silence < MAX_SILENCE) { S.silence += 1; sendTurn({ kind: "silence" }); }
        else { S.phase = "idle"; render(); }
      }
    };
    try { rec.start(); } catch { S.micState = "off"; return false; }
    S.rec = { stop: () => rec.stop(), abort: () => { aborted = true; rec.abort(); } };
    S.micState = "ok";
    return true;
  }
  const stopListen = () => { if (S.rec) S.rec.abort(); S.rec = null; S.interim = ""; };

  // ---------- 턴 ----------
  async function sendTurn(input) {
    if (S.busy || ["report", "ending", "setup"].includes(S.phase)) return;
    const sample = S.sample || (await sampleReady);
    if (!sample) { S.error = "이 페이지에서는 Claude 를 쓸 수 없어요. claude.ai 안에서 열어 주세요."; S.phase = "idle"; render(); return; }
    S.busy = true; stopListen(); stopSpeak(); S.error = null;
    if (S.startedAt === null) S.startedAt = Date.now();
    const g = gate();
    if (g === "closed") { S.busy = false; return finishLesson(); }
    const left = remainingSec();
    const note = g === "grace" || input.kind === "timeup" ? "[Time is up]" : timeNote(left);
    const parts = [];
    if (input.kind === "start") parts.push("[Lesson starts]");
    else if (input.kind === "silence") parts.push(`[The student did not answer for ${SILENCE_SEC} seconds]`);
    else if (input.kind === "speech") parts.push(input.text.trim());
    if (note) parts.push(note);
    const content = parts.join("\n");
    S.turns.push({ role: "user", content });
    if (input.kind === "speech") S.shown.push({ role: "student", text: input.text.trim() });
    else S.shown.push({ role: "sys", text: content });
    S.live = ""; S.phase = "thinking"; render();

    // 64KiB 제한: 지침은 항상 유지하고 오래된 턴부터 버린다.
    const recent = S.turns.slice(-60);
    const ctl = new AbortController(); S.ctl = ctl;
    let text;
    try {
      const r = await sample([{ role: "user", content: instructions() }, ...recent], {
        cache: false, modelTier: "quick", signal: ctl.signal,
        onText: ({ text: t }) => { S.live = t; render(); },
      });
      text = r.text.trim();
    } catch (e) {
      S.turns.pop(); S.shown.pop();
      if (e && e.code === "cancelled") { S.phase = "idle"; }
      else { S.error = copyFor(e); S.phase = "idle"; if (permanent(e)) S.sampleGone = true; }
      if (S.turns.length === 0) S.startedAt = null;
      S.busy = false; S.live = ""; render(); return;
    }
    S.turns.push({ role: "assistant", content: text });
    const { speech, hint } = splitHint(text);
    S.shown.push({ role: "tutor", text: speech, hint });
    S.live = ""; S.phase = "speaking"; render();
    await speak(speech);
    S.busy = false;
    const ended = g === "grace" || input.kind === "timeup";
    if (ended) { S.endedAt = Date.now(); return finishLesson(); }
    startListening();
  }

  function startListening() {
    if (S.busy || ["report", "ending"].includes(S.phase)) return;
    if (S.micState === "off") { S.phase = "idle"; render(); focusInput(); return; }
    S.phase = "listening"; render();
    if (!listen()) { S.phase = "idle"; render(); focusInput(); }
  }
  const focusInput = () => { const i = $("#say"); if (i) i.focus(); };

  async function finishLesson() {
    stopListen(); stopSpeak();
    if (S.ctl) S.ctl.abort();
    S.endedAt = S.endedAt || Date.now();
    S.phase = "ending"; S.error = null; render();
    const studentTurns = S.shown.filter((t) => t.role === "student").length;
    if (studentTurns === 0 || !S.sample) { S.report = null; S.phase = "report"; render(); return; }
    const transcript = S.shown.filter((t) => t.role !== "sys").map((t) => `${t.role === "tutor" ? "Tutor" : "Student"}: ${t.text}`).join("\n");
    const p = S.profile, topic = TOPICS.find((t) => t.id === p.topicId);
    const prompt = `You write short, honest lesson reports for parents of Korean children after a 1:1 English speaking lesson with an AI tutor.
Write Korean fields in warm, plain Korean (존댓말). Be specific: quote what the student actually said. Do not exaggerate. If the student spoke very little, say so kindly and suggest what would help.

Student: ${p.name}, age ${p.age}, level ${p.level}. Topic: ${topic.en}. Lesson length: ${p.durationMin} minutes.

<transcript>
${transcript}
</transcript>

Reply with ONLY one JSON object of this exact shape:
{"summary_ko": string (3-4 sentences for parents), "strengths_ko": string[] (max 3), "corrections": [{"student_said": string, "better": string, "note_ko": string}] (max 5, skip transcription noise), "new_expressions": [{"expression": string, "meaning_ko": string}] (max 6), "next_lesson_focus_ko": string, "level_signal": "below" | "on" | "above", "praise_for_student_en": string (one sentence to read to the child)}`;
    try {
      const r = await S.sample.json(prompt, { modelTier: "default", cache: false });
      S.report = r && typeof r === "object" ? r : null;
    } catch (e) {
      S.report = null; S.error = copyFor(e);
    }
    S.phase = "report"; render();
  }

  // 타이머
  setInterval(() => {
    if (!S.profile || S.startedAt === null) return;
    if (["setup", "ready", "ending", "report"].includes(S.phase)) return;
    const left = remainingSec();
    const t = $("#timer"); if (t) { t.textContent = fmt(left); t.classList.toggle("low", left <= 60); }
    if (left <= 0 && !S.timeUpSent) {
      S.timeUpSent = true;
      const fire = () => { if (S.busy) return setTimeout(fire, 500); sendTurn({ kind: "timeup" }); };
      fire();
    }
  }, 1000);
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  // ---------- 화면 ----------
  function render() {
    const view = $("#view"), right = $("#topRight");
    view.replaceChildren();
    if (S.phase === "setup") { right.replaceChildren(el("span", { class: "pill" }, "데모 · 시간당 1,000원")); return view.append(renderSetup()); }
    if (S.phase === "report") { right.replaceChildren(el("span", { class: "pill" }, "수업 끝")); return view.append(renderReport()); }
    right.replaceChildren(
      el("span", { class: "pill timer" + (remainingSec() <= 60 && S.startedAt ? " low" : ""), id: "timer" }, fmt(remainingSec())),
      S.phase !== "ready" ? el("button", { class: "btn quiet small", onclick: () => finishLesson(), disabled: S.phase === "ending" }, "끝내기") : null,
    );
    view.append(renderLesson());
  }

  function renderSetup() {
    const saved = load("coco.setup", {});
    const f = { name: saved.name || "", age: saved.age || 8, level: saved.level || "starter", topicId: saved.topicId || "favorites", durationMin: saved.durationMin || 3 };
    const choices = (items, key, labelOf, subOf) => el("div", { class: "choices" }, items.map((it) => {
      const id = typeof it === "object" ? it.id : it;
      const b = el("button", { type: "button", class: "choice", "aria-pressed": String(f[key] === id) }, el("b", {}, labelOf(it)), el("small", {}, subOf(it)));
      b.addEventListener("click", () => { f[key] = id; [...b.parentNode.children].forEach((c) => c.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); const s = $("#startBtn"); if (s) s.textContent = startLabel(); });
      return b;
    }));
    const startLabel = () => `${priceKrw(f.durationMin).toLocaleString("ko-KR")}원으로 수업 시작`;
    const nameIn = el("input", { type: "text", id: "name", placeholder: "예: Mina", maxlength: "20", value: f.name, required: true });
    const ageIn = el("input", { type: "number", id: "age", min: "5", max: "15", value: String(f.age) });
    const form = el("form", { class: "card", onsubmit: (e) => {
      e.preventDefault();
      f.name = nameIn.value.trim(); f.age = Math.min(15, Math.max(5, Number(ageIn.value) || 8));
      if (!f.name) { nameIn.focus(); return; }
      save("coco.setup", f);
      S.profile = { ...f }; S.tts = "speechSynthesis" in window;
      S.phase = "ready"; render();
    } },
      el("h1", {}, "말하기로 배우는 1:1 영어 수업"),
      el("p", { class: "muted" }, "AI 선생님 코코가 질문을 이어가며 아이가 계속 영어로 말하게 이끌어요. 이 데모는 실제 앱과 같은 선생님 지침으로 동작해요."),
      S.sampleGone ? el("div", { class: "note err" }, "이 페이지는 claude.ai 안에서 열어야 선생님을 부를 수 있어요.") : null,
      el("div", { class: "field" }, el("label", { for: "name" }, "아이 이름 (영어로 불러요)"), nameIn),
      el("div", { class: "field" }, el("label", { for: "age" }, "나이"), ageIn),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "영어 레벨"), choices(LEVELS, "level", (l) => l.label, (l) => l.desc)),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "오늘의 주제"), choices(TOPICS, "topicId", (t) => t.label, (t) => t.en)),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "수업 길이"), choices(DURATIONS, "durationMin", (d) => `${d}분`, (d) => d === 3 ? "테스트용 · " + priceKrw(d) + "원" : priceKrw(d).toLocaleString("ko-KR") + "원")),
      el("div", { class: "field" }, el("button", { class: "btn", type: "submit", id: "startBtn" }, startLabel())),
      el("div", { class: "note info" }, "데모에서는 글로 대답하고 선생님 목소리는 브라우저 TTS 로 들려요. 마이크 입력은 실제 앱(Chrome/Edge)에서 동작해요. Claude 호출은 보시는 분의 claude.ai 사용량으로 계산돼요."),
      el("details", { style: "margin-top:14px" }, el("summary", {}, "선생님 지침 보기"), el("div", { class: "prompt-box", style: "margin-top:8px" }, CORE)),
    );
    return form;
  }

  function renderLesson() {
    const wrap = el("div", { class: "stage" });
    if (S.phase === "ready") {
      wrap.append(el("div", { class: "card" },
        el("h1", {}, `${S.profile.name}, 준비됐나요?`),
        el("p", { class: "muted" }, `${S.profile.durationMin}분 동안 코코 선생님과 영어로 이야기해요. 선생님 말이 끝나면 대답 차례예요. 잘 모르겠으면 아는 만큼만 말해도 괜찮아요.`),
        S.error ? el("div", { class: "note err" }, S.error) : null,
        el("button", { class: "btn", type: "button", onclick: () => sendTurn({ kind: "start" }) }, "선생님과 인사하기"),
        el("div", { class: "note info" }, "첫 호출 때 claude.ai 가 이 페이지의 Claude 사용을 허용할지 물어봐요. 허용해야 수업이 시작돼요."),
      ));
      return wrap;
    }
    for (const t of S.shown) {
      if (t.role === "tutor") wrap.append(el("div", { class: "bubble tutor" }, el("div", { class: "who" }, el("span", { class: "avatar" }, "C"), "Coco"), t.text, t.hint ? el("div", { class: "hint" }, "힌트: " + t.hint) : null));
      else if (t.role === "student") wrap.append(el("div", { class: "bubble student" }, t.text));
      else wrap.append(el("div", { class: "bubble sys" }, t.text));
    }
    if (S.phase === "thinking") wrap.append(el("div", { class: "bubble tutor" }, el("div", { class: "who" }, el("span", { class: "avatar" }, "C"), "Coco"), S.live ? S.live : el("span", { class: "dots" }, "생각하는 중")));
    if (S.interim) wrap.append(el("div", { class: "bubble student interim" }, S.interim));

    const statusText = { thinking: "선생님이 생각하는 중", speaking: "선생님이 말하는 중 (보내기를 누르면 바로 대답할 수 있어요)", listening: "듣고 있어요. 영어로 말해 보세요!", idle: "대답을 쓰고 보내기를 누르세요", ending: "리포트를 만드는 중" }[S.phase] || "";
    const input = el("input", { type: "text", id: "say", placeholder: "영어로 대답하기 (한국어도 알아들어요)", autocomplete: "off", disabled: S.phase === "thinking" || S.phase === "ending" });
    const send = el("button", { type: "submit", class: "send", disabled: S.phase === "thinking" || S.phase === "ending" }, "보내기");
    const mic = S.micState === "off" ? null : el("button", { type: "button", class: "mic" + (S.phase === "listening" ? " on" : ""), "aria-label": "마이크", disabled: S.phase === "thinking" || S.phase === "ending", onclick: () => {
      if (S.phase === "listening") { if (S.rec) S.rec.stop(); return; }
      if (S.phase === "speaking") stopSpeak();
      S.silence = 0; startListening();
    } }, S.phase === "listening" ? "👂" : "🎤");
    const form = el("form", { class: "composer", onsubmit: (e) => {
      e.preventDefault(); const t = input.value.trim(); if (!t) return; input.value = ""; S.silence = 0; sendTurn({ kind: "speech", text: t });
    } }, input, send, mic);
    const dock = el("div", { class: "dock" },
      S.error ? el("div", { class: "note err", style: "margin:0 0 8px" }, S.error) : null,
      S.notice ? el("div", { class: "note warn", style: "margin:0 0 8px" }, S.notice) : null,
      el("div", { class: "status" + (S.phase === "listening" ? " listening" : "") }, statusText),
      form,
      el("div", { class: "row" }, el("span", {}, `${S.profile.durationMin}분 · ${priceKrw(S.profile.durationMin).toLocaleString("ko-KR")}원 · ${LEVELS.find((l) => l.id === S.profile.level).label}`), el("span", {}, S.tts ? "TTS 켜짐" : "TTS 없음")),
    );
    const root = el("div", { style: "display:flex;flex-direction:column;min-height:calc(100dvh - 80px)" }, wrap, dock);
    queueMicrotask(() => { window.scrollTo({ top: document.body.scrollHeight }); if (S.phase === "idle") focusInput(); });
    return root;
  }

  function renderReport() {
    const r = S.report, p = S.profile;
    const usedMin = S.startedAt && S.endedAt ? Math.max(1, Math.round((S.endedAt - S.startedAt) / 60000)) : 0;
    const studentTurns = S.shown.filter((t) => t.role === "student").length;
    const sig = { below: "조금 더 쉬운 레벨을 추천해요", on: "지금 레벨이 잘 맞아요", above: "한 단계 높은 레벨도 좋아요" };
    const arr = (v) => Array.isArray(v) ? v : [];
    const root = el("div", {},
      el("div", { class: "card" },
        el("h1", {}, "오늘 수업 리포트"),
        el("p", { class: "muted" }, `${p.name} · ${p.durationMin}분 수업 · ${priceKrw(p.durationMin).toLocaleString("ko-KR")}원`),
        el("div", { class: "stats" }, el("div", { class: "stat" }, el("b", {}, `${usedMin}분`), el("span", {}, "수업 시간")), el("div", { class: "stat" }, el("b", {}, `${studentTurns}회`), el("span", {}, "아이가 말한 횟수")), el("div", { class: "stat" }, el("b", {}, `${S.shown.filter((t) => t.role === "tutor").length}회`), el("span", {}, "선생님 발화"))),
        S.error ? el("div", { class: "note err" }, S.error) : null,
      ),
      r ? el("div", { class: "card" },
        r.praise_for_student_en ? el("div", { class: "praise" }, `“${r.praise_for_student_en}”`) : null,
        el("h2", {}, "수업 요약"), el("p", {}, String(r.summary_ko || "")),
        arr(r.strengths_ko).length ? [el("h2", {}, "잘한 점"), el("ul", {}, arr(r.strengths_ko).map((s) => el("li", {}, String(s))))] : null,
        arr(r.corrections).length ? [el("h2", {}, "다시 보면 좋은 표현"), arr(r.corrections).map((c) => el("div", { class: "fix" }, el("s", {}, String(c.student_said || "")), " → ", el("b", {}, String(c.better || "")), el("span", { class: "why" }, String(c.note_ko || ""))))] : null,
        arr(r.new_expressions).length ? [el("h2", {}, "오늘 배운 표현"), el("ul", {}, arr(r.new_expressions).map((x) => el("li", {}, el("b", {}, String(x.expression || "")), " — ", String(x.meaning_ko || ""))))] : null,
        el("h2", {}, "다음 수업에서는"), el("p", {}, String(r.next_lesson_focus_ko || "")),
        el("span", { class: "pill", style: "background:var(--mint-soft);color:var(--mint)" }, sig[r.level_signal] || String(r.level_signal || "")),
      ) : el("div", { class: "card" }, el("p", {}, studentTurns === 0 ? "아이가 말한 내용이 없어 리포트를 만들지 않았어요." : "리포트를 만들지 못했어요.")),
      el("div", { class: "card" },
        el("details", {}, el("summary", {}, "대화 전체 보기"), el("div", { class: "prompt-box", style: "margin-top:8px" }, S.shown.map((t) => `${t.role === "tutor" ? "Coco" : t.role === "student" ? p.name : "system"}: ${t.text}${t.hint ? "\n  힌트: " + t.hint : ""}`).join("\n"))),
        el("div", { class: "field" }, el("button", { class: "btn quiet", type: "button", onclick: () => {
          Object.assign(S, { phase: "setup", profile: null, turns: [], shown: [], live: "", interim: "", startedAt: null, endedAt: null, silence: 0, timeUpSent: false, busy: false, report: null, error: null, notice: null });
          render();
        } }, "새 수업 시작하기")),
      ),
    );
    return root;
  }

  render();
})();
</script>
